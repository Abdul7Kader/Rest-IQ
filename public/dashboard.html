<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gastrofy</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .sidebar { width: 250px; background: white; border-right: 1px solid var(--border); height: 100vh; position: fixed; left: 0; top: 0; padding: 2rem 1rem; }
        .sidebar-nav { list-style: none; margin-top: 2rem; }
        .sidebar-nav li { margin-bottom: 0.5rem; }
        .sidebar-nav a { display: block; padding: 0.75rem 1rem; color: var(--text); text-decoration: none; border-radius: 4px; transition: background 0.2s; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: var(--bg); color: var(--primary); font-weight: 600; }
        .main-content { margin-left: 250px; padding: 2rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .menu-item { border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; background: white; position: relative; }
        .menu-cat { border-left: 4px solid var(--primary); background: #f8fafc; padding: 1rem; margin-top: 2rem; border-radius: 0 8px 8px 0; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.8rem; }
        .hours-grid { display: grid; grid-template-columns: 120px 1fr; gap: 1rem; align-items: center; }
        .preview-bar { background: #1e293b; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="padding: 0 1rem; color: var(--primary);">Gastrofy</h2>
        <ul class="sidebar-nav">
            <li><a href="#" onclick="showTab('base')" id="nav-base" class="active">Grunddaten</a></li>
            <li><a href="#" onclick="showTab('hours')" id="nav-hours">Öffnungszeiten</a></li>
            <li><a href="#" onclick="showTab('menu')" id="nav-menu">Speisekarte</a></li>
            <li><a href="#" onclick="showTab('design')" id="nav-design">Design & Hero</a></li>
            <li><a href="#" onclick="showTab('help')" id="nav-help">Hilfe</a></li>
            <li style="margin-top: 2rem;"><a href="/preview" target="_blank" style="background: var(--primary); color: white;">Live Vorschau</a></li>
            <li style="margin-top: 0.5rem;"><a href="#" id="publishBtn" style="background: var(--success); color: white;">Lokal Veröffentlichen</a></li>
            <li style="margin-top: 1rem;"><a href="#" id="logoutBtn" style="color: var(--error);">Abmelden</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div id="alert" class="alert alert-error hidden"></div>
        <div id="success" class="alert alert-success hidden">Änderungen gespeichert!</div>

        <!-- Grunddaten -->
        <div id="tab-base" class="tab-content active">
            <div class="section-header">
                <h1>Grunddaten</h1>
            </div>
            <div class="card">
                <form onsubmit="handleSave(event, 'base')">
                    <div class="grid">
                        <div class="form-group"><label>Restaurant Name</label><input type="text" name="restaurant_name" required></div>
                        <div class="form-group"><label>E-Mail</label><input type="email" name="contact_email"></div>
                    </div>
                    <div class="form-group"><label>Kurzbeschreibung</label><textarea name="short_description"></textarea></div>
                    <div class="grid">
                        <div class="form-group"><label>Telefon</label><input type="text" name="contact_phone"></div>
                        <div class="form-group"><label>WhatsApp</label><input type="text" name="whatsapp"></div>
                    </div>
                    <div class="grid" style="grid-template-columns: 2fr 1fr;">
                        <div class="form-group"><label>Straße</label><input type="text" name="street"></div>
                        <div class="form-group"><label>Hausnr.</label><input type="text" name="house_number"></div>
                    </div>
                    <div class="grid">
                        <div class="form-group"><label>PLZ</label><input type="text" name="postal_code"></div>
                        <div class="form-group"><label>Stadt</label><input type="text" name="city"></div>
                    </div>
                    <button type="submit">Speichern</button>
                </form>
            </div>
        </div>

        <!-- Öffnungszeiten -->
        <div id="tab-hours" class="tab-content">
            <div class="section-header">
                <h1>Öffnungszeiten</h1>
            </div>
            <div class="card">
                <form onsubmit="handleSaveHours(event)">
                    <div id="hoursList" class="hours-grid">
                        <!-- Sunday to Monday injected here -->
                    </div>
                    <button type="submit" style="margin-top: 2rem;">Alle Zeiten speichern</button>
                </form>
            </div>
        </div>

        <!-- Speisekarte -->
        <div id="tab-menu" class="tab-content">
            <div class="section-header">
                <h1>Speisekarte</h1>
                <button onclick="addCategory()">Neue Kategorie</button>
            </div>
            <div id="menuStructure">
                <!-- Categories and Dishes injected here -->
            </div>
        </div>

        <!-- Design -->
        <div id="tab-design" class="tab-content">
            <div class="section-header">
                <h1>Design & Inhalte</h1>
            </div>
            <div class="card">
                <form onsubmit="handleSave(event, 'design')">
                    <div class="form-group"><label>Hero Titel</label><input type="text" name="hero_title"></div>
                    <div class="form-group"><label>Hero Untertitel</label><input type="text" name="hero_subtitle"></div>
                    <div class="form-group"><label>Über uns Text</label><textarea name="about_text" rows="5"></textarea></div>
                    <div class="grid">
                        <div class="form-group">
                            <label>Template</label>
                            <select name="template_key">
                                <option value="free_default">Modern (Modern, Luftig)</option>
                                <option value="free_classic">Classic (Traditionell, Zentriert)</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Akzentfarbe</label><input type="color" name="accent_color" style="height: 50px;"></div>
                    </div>
                    <div class="form-group"><label>Logo URL</label><input type="text" name="logo_image_url"></div>
                    <div class="form-group"><label>Hero Bild URL</label><input type="text" name="hero_image_url"></div>
                    <div class="form-group"><label>Footer Notiz</label><input type="text" name="footer_note"></div>
                    <button type="submit">Design speichern</button>
                </form>
            </div>
        </div>

        <!-- Hilfe -->
        <div id="tab-help" class="tab-content">
             <div class="section-header">
                <h1>Hilfe & Dokumentation</h1>
            </div>
            <div id="helpArticles" class="grid"></div>
        </div>
    </div>

    <!-- Modals (Simple overlays) -->
    <div id="modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div class="card" style="width: 500px;" id="modalContent"></div>
    </div>

    <script>
        let restaurantData = null;
        const weekdays = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

        async function init() {
            const res = await fetch('/api/restaurant');
            restaurantData = await res.json();
            if (!restaurantData) window.location.href = 'index.html';
            
            fillForms();
            loadHours();
            loadMenu();
            loadHelp();
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
        }

        function fillForms() {
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                const inputs = form.querySelectorAll('input, textarea, select');
                inputs.forEach(input => {
                    const name = input.name;
                    if (restaurantData[name] !== undefined) input.value = restaurantData[name];
                    else if (restaurantData.config && restaurantData.config[name] !== undefined) input.value = restaurantData.config[name];
                });
            });
        }

        async function handleSave(e, type) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            const res = await fetch('/api/restaurant', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) showSuccess();
        }

        async function loadHours() {
            const res = await fetch('/api/opening-hours');
            const hours = await res.json();
            const grid = document.getElementById('hoursList');
            grid.innerHTML = '';
            
            weekdays.forEach((day, i) => {
                const h = hours.find(x => x.weekday === i) || { weekday: i, is_closed: 0, open_time_1: '09:00', close_time_1: '22:00' };
                grid.innerHTML += `
                    <strong>${day}</strong>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="checkbox" name="closed-${i}" ${h.is_closed ? 'checked' : ''} style="width: 20px;"> Geschlossen
                        <input type="time" name="open1-${i}" value="${h.open_time_1 || ''}"> - 
                        <input type="time" name="close1-${i}" value="${h.close_time_1 || ''}">
                        <input type="text" name="note-${i}" placeholder="Notiz" value="${h.note || ''}">
                    </div>
                `;
            });
        }

        async function handleSaveHours(e) {
            e.preventDefault();
            const hours = weekdays.map((_, i) => ({
                weekday: i,
                is_closed: e.target.querySelector(`[name="closed-${i}"]`).checked,
                open_time_1: e.target.querySelector(`[name="open1-${i}"]`).value,
                close_time_1: e.target.querySelector(`[name="close1-${i}"]`).value,
                note: e.target.querySelector(`[name="note-${i}"]`).value
            }));

            const res = await fetch('/api/opening-hours', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hours })
            });
            if (res.ok) showSuccess();
        }

        async function loadMenu() {
            const res = await fetch('/api/menu');
            const menu = await res.json();
            const container = document.getElementById('menuStructure');
            container.innerHTML = '';

            menu.categories.forEach(cat => {
                const catEl = document.createElement('div');
                catEl.className = 'menu-cat';
                catEl.innerHTML = `
                    <div style="display: flex; justify-content: space-between;">
                        <h3>${cat.category_name} (${cat.display_mode})</h3>
                        <div>
                            <button class="btn-sm secondary" onclick="editCategory(${JSON.stringify(cat).replace(/"/g, '&quot;')})">Bearbeiten</button>
                            <button class="btn-sm" onclick="addDish(${cat.id})">+ Gericht</button>
                        </div>
                    </div>
                `;
                
                cat.dishes.forEach(dish => {
                    const dishEl = document.createElement('div');
                    dishEl.className = 'menu-item';
                    dishEl.innerHTML = `
                        <div style="display: flex; justify-content: space-between;">
                            <strong>${dish.dish_name} - ${(dish.price_cents / 100).toFixed(2)}€</strong>
                            <button class="btn-sm secondary" onclick="editDish(${JSON.stringify(dish).replace(/"/g, '&quot;')})">Edit</button>
                        </div>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">${dish.description_text}</p>
                    `;
                    catEl.appendChild(dishEl);
                });
                container.appendChild(catEl);
            });
        }

        // --- Modals for Menu CRUD ---

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        function addCategory() {
            openModal(`
                <h2>Neue Kategorie</h2>
                <form onsubmit="saveCategory(event)">
                    <div class="form-group"><label>Name</label><input type="text" name="category_name" required></div>
                    <div class="form-group">
                        <label>Anzeige</label>
                        <select name="display_mode"><option value="vertical">Vertikal</option><option value="horizontal">Horizontal</option></select>
                    </div>
                    <button type="submit">Speichern</button>
                    <button type="button" class="secondary" onclick="closeModal()">Abbrechen</button>
                </form>
            `);
        }

        async function saveCategory(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            data.menu_id = restaurantData.id; // Corrected: should be the active menu ID, but restaurantData has it if loaded
            const res = await fetch('/api/menu/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...data, menu_id: 1 }) // Hardcoded 1 for demo since we only have one menu
            });
            if (res.ok) { closeModal(); loadMenu(); }
        }

        function addDish(catId) {
            openModal(`
                <h2>Neues Gericht</h2>
                <form onsubmit="saveDish(event, ${catId})">
                    <div class="form-group"><label>Name</label><input type="text" name="dish_name" required></div>
                    <div class="form-group"><label>Preis (€)</label><input type="number" step="0.01" name="price" required></div>
                    <div class="form-group"><label>Beschreibung</label><textarea name="description_text"></textarea></div>
                    <button type="submit">Speichern</button>
                    <button type="button" class="secondary" onclick="closeModal()">Abbrechen</button>
                </form>
            `);
        }

        async function saveDish(e, catId) {
            e.preventDefault();
            const form = new FormData(e.target);
            const data = Object.fromEntries(form.entries());
            data.category_id = catId;
            data.price_cents = Math.round(parseFloat(data.price) * 100);

            const res = await fetch('/api/dishes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) { closeModal(); loadMenu(); }
        }

        // --- Utils ---

        function showSuccess() {
            const s = document.getElementById('success');
            s.classList.remove('hidden');
            setTimeout(() => s.classList.add('hidden'), 3000);
        }

        async function loadHelp() {
            const res = await fetch('/api/help/articles');
            const articles = await res.json();
            const container = document.getElementById('helpArticles');
            articles.forEach(a => {
                container.innerHTML += `<div class="card"><h3>${a.title}</h3><a href="/help.html">Lesen</a></div>`;
            });
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            fetch('/api/auth/logout', { method: 'POST' }).then(() => window.location.href = 'index.html');
        });

        document.getElementById('publishBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const btn = e.target;
            const originalText = btn.textContent;
            btn.textContent = 'Veröffentliche...';
            
            try {
                const res = await fetch('/api/restaurant/publish', { method: 'POST' });
                const data = await res.json();
                
                if (res.ok) {
                    const alert = document.getElementById('alert');
                    alert.textContent = 'Erfolgreich veröffentlicht! ' + data.exportPath;
                    alert.className = 'alert alert-success';
                    alert.classList.remove('hidden');
                } else {
                    const alert = document.getElementById('alert');
                    alert.textContent = data.error || 'Fehler beim Veröffentlichen.';
                    alert.className = 'alert alert-error';
                    alert.classList.remove('hidden');
                }
            } catch(err) {
                const alert = document.getElementById('alert');
                alert.textContent = 'Serverfehler beim Veröffentlichen.';
                alert.className = 'alert alert-error';
                alert.classList.remove('hidden');
            }
            
            btn.textContent = originalText;
            setTimeout(() => document.getElementById('alert').classList.add('hidden'), 8000);
        });

        init();
    </script>
</body>
</html>

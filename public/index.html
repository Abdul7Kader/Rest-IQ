<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gastrofy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 5rem;">
        <div class="card">
            <h1>Gastrofy</h1>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Anmelden, um Ihr Restaurant zu verwalten.</p>
            
            <div id="alert" class="alert alert-error hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-Mail Adresse</label>
                    <input type="email" id="email" required placeholder="name@beispiel.de">
                </div>
                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" style="width: 100%;">Anmelden</button>
            </form>

            <p style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
                Noch kein Konto? <a href="register.html">Jetzt registrieren</a>
            </p>
        </div>
        
        <div style="margin-top: 2rem; padding: 1rem; border: 1px dashed var(--border); border-radius: 8px; font-size: 0.8rem; color: var(--text-muted);">
            <strong>Test-Zugangsdaten:</strong><br>
            Admin: admin@gastrofy.app / admin123<br>
            Owner: mario@trattoria-mario.de / owner123
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alert = document.getElementById('alert');
            alert.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (data.success) {
                    if (data.user.role === 'platform_admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    alert.textContent = data.error || 'Login fehlgeschlagen.';
                    alert.classList.remove('hidden');
                }
            } catch (err) {
                alert.textContent = 'Serverfehler.';
                alert.classList.remove('hidden');
            }
        });

        // Check if already logged in
        async function checkStatus() {
            const res = await fetch('/api/auth/me');
            if (res.ok) {
                const user = await res.json();
                if (user.role === 'platform_admin') window.location.href = 'admin.html';
                else window.location.href = 'dashboard.html';
            }
        }
        checkStatus();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilfe & Tutorials - Restiq</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .article-card { cursor: pointer; transition: transform 0.1s; }
        .article-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .markdown-content h1 { font-size: 1.5rem; margin-top: 1.5rem; }
        .markdown-content h2 { font-size: 1.2rem; margin-top: 1.25rem; }
        .markdown-content p { margin-bottom: 1rem; }
        .markdown-content ol, .markdown-content ul { margin-left: 1.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <strong>Hilfe & Tutorials</strong>
            <a href="dashboard.html" id="backBtn">Zurück zum Dashboard</a>
        </div>

        <div id="listView">
            <h1>Wie können wir helfen?</h1>
            <div id="articleList" class="grid" style="margin-top: 2rem;">
                <!-- Articles injected here -->
            </div>
        </div>

        <div id="detailView" class="hidden">
            <button class="secondary" onclick="showList()" style="margin-bottom: 2rem;">&larr; Alle Artikel</button>
            <div class="card">
                <div id="articleType" class="badge badge-free" style="margin-bottom: 1rem; display: inline-block;"></div>
                <h1 id="articleTitle"></h1>
                <div id="articleContent" class="markdown-content"></div>
            </div>
        </div>
    </div>

    <script>
        const listView = document.getElementById('listView');
        const detailView = document.getElementById('detailView');

        async function loadArticles() {
            const res = await fetch('/api/help/articles');
            const articles = await res.json();
            const list = document.getElementById('articleList');
            list.innerHTML = '';

            articles.forEach(a => {
                const card = document.createElement('div');
                card.className = 'card article-card';
                card.innerHTML = `
                    <div class="badge badge-free" style="margin-bottom: 1rem;">${escapeHtml(a.article_type.toUpperCase())}</div>
                    <h3>${escapeHtml(a.title)}</h3>
                    <p style="font-size: 0.875rem; color: var(--text-muted);">Erfahren Sie mehr über ${escapeHtml(a.title.toLowerCase())}.</p>
                `;
                card.onclick = () => loadDetail(a.id);
                list.appendChild(card);
            });

            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('article');
            if (articleId) loadDetail(articleId);
        }

        async function loadDetail(id) {
            const res = await fetch(`/api/help/articles/${id}`);
            const article = await res.json();

            document.getElementById('articleTitle').textContent = article.title;
            document.getElementById('articleType').textContent = article.article_type.toUpperCase();
            
            document.getElementById('articleContent').innerHTML = renderMarkdownLite(article.content_markdown);

            listView.classList.add('hidden');
            detailView.classList.remove('hidden');
        }

        function showList() {
            history.replaceState(null, '', 'help.html');
            listView.classList.remove('hidden');
            detailView.classList.add('hidden');
        }

        function renderMarkdownLite(markdown) {
            const lines = markdown.split('\n');
            let html = '';
            let listType = null;

            function closeList() {
                if (listType) {
                    html += `</${listType}>`;
                    listType = null;
                }
            }

            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) {
                    closeList();
                    continue;
                }
                if (trimmed.startsWith('## ')) {
                    closeList();
                    html += `<h2>${escapeHtml(trimmed.slice(3))}</h2>`;
                } else if (trimmed.startsWith('# ')) {
                    closeList();
                    html += `<h1>${escapeHtml(trimmed.slice(2))}</h1>`;
                } else if (/^\d+\.\s/.test(trimmed)) {
                    if (listType !== 'ol') {
                        closeList();
                        listType = 'ol';
                        html += '<ol>';
                    }
                    html += `<li>${escapeHtml(trimmed.replace(/^\d+\.\s/, ''))}</li>`;
                } else if (trimmed.startsWith('- ')) {
                    if (listType !== 'ul') {
                        closeList();
                        listType = 'ul';
                        html += '<ul>';
                    }
                    html += `<li>${escapeHtml(trimmed.slice(2))}</li>`;
                } else {
                    closeList();
                    html += `<p>${escapeHtml(trimmed)}</p>`;
                }
            }
            closeList();
            return html;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Check if back button should go to Admin or Dashboard
        async function checkBack() {
            const res = await fetch('/api/auth/me');
            const me = await res.json();
            if (me.role === 'platform_admin') {
                document.getElementById('backBtn').href = 'admin.html';
                document.getElementById('backBtn').textContent = 'Zurück zum Admin-Bereich';
            }
        }

        checkBack();
        loadArticles();
    </script>
</body>
</html>

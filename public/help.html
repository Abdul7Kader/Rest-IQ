<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilfe & Tutorials - Restiq</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .article-card { cursor: pointer; transition: transform 0.1s; }
        .article-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .markdown-content h1 { font-size: 1.5rem; margin-top: 1.5rem; }
        .markdown-content h2 { font-size: 1.2rem; margin-top: 1.25rem; }
        .markdown-content p { margin-bottom: 1rem; }
        .markdown-content ol, .markdown-content ul { margin-left: 1.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <strong>Hilfe & Tutorials</strong>
            <a href="dashboard.html" id="backBtn">Zurück zum Dashboard</a>
        </div>

        <div id="listView">
            <h1>Wie können wir helfen?</h1>
            <div id="articleList" class="grid" style="margin-top: 2rem;">
                <!-- Articles injected here -->
            </div>
        </div>

        <div id="detailView" class="hidden">
            <button id="showListBtn" class="secondary" style="margin-bottom: 2rem;">&larr; Alle Artikel</button>
            <div class="card">
                <div id="articleType" class="badge badge-free" style="margin-bottom: 1rem; display: inline-block;"></div>
                <h1 id="articleTitle"></h1>
                <div id="articleContent" class="markdown-content"></div>
            </div>
        </div>
    </div>

    <script src="/js/help-page.js"></script>
</body>
</html>

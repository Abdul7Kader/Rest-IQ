<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Restiq</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .admin-actions a, .admin-actions button { font-size: 0.8rem; padding: 0.4rem 0.6rem; text-decoration: none; border-radius: 4px; }
        .admin-actions a { background: var(--bg); color: var(--primary); border: 1px solid var(--border); }
        .status-pill { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .status-ok { background: #dcfce7; color: #166534; }
        .status-warn { background: #fef3c7; color: #92400e; }
        .status-muted { background: #e2e8f0; color: #475569; }
        .admin-note { margin-bottom: 1rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1000px;">
        <div class="nav">
            <strong>Restiq Platform Admin</strong>
            <div>
                <a href="#" id="logoutBtn">Abmelden</a>
            </div>
        </div>

        <h1>Alle Restaurants</h1>
        <p class="admin-note">Operative Übersicht für Owner-Zustand, lokale Veröffentlichung und vorbereiteten Free-Hostname.</p>
        <div id="alert" class="alert hidden"></div>
        
        <div class="card" style="padding: 0; overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead style="background: var(--bg); border-bottom: 1px solid var(--border);">
                    <tr>
                        <th style="padding: 1rem; text-align: left;">Restaurant Name</th>
                        <th style="padding: 1rem; text-align: left;">Inhaber (Email)</th>
                        <th style="padding: 1rem; text-align: left;">Tarif</th>
                        <th style="padding: 1rem; text-align: left;">Veröffentlichung</th>
                        <th style="padding: 1rem; text-align: left;">Free Hostname</th>
                        <th style="padding: 1rem; text-align: left;">Aktionen</th>
                    </tr>
                </thead>
                <tbody id="restaurantTable">
                    <!-- Rows will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadRestaurants() {
            const res = await fetch('/api/admin/restaurants');
            if (!res.ok) {
                if (res.status === 403) alert('Zugriff verweigert (Admin-Rechte erforderlich)');
                window.location.href = 'index.html';
                return;
            }
            
            const restaurants = await res.json();
            const table = document.getElementById('restaurantTable');
            table.innerHTML = '';

            if (restaurants.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="6" style="padding: 2rem; text-align: center; color: var(--text-muted);">
                            Noch keine Restaurants vorhanden.
                        </td>
                    </tr>
                `;
                return;
            }

            for (const r of restaurants) {
                const published = r.is_published === 1;
                const domainStatus = r.free_domain_status || 'nicht vorbereitet';
                const domainClass = domainStatus === 'active' ? 'status-ok' : (domainStatus === 'pending' ? 'status-warn' : 'status-muted');
                const publishedClass = published ? 'status-ok' : 'status-muted';
                const publishedLink = published
                    ? `<a href="/published/${r.public_slug_internal}" target="_blank">Published</a>`
                    : '';
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid var(--border)';
                tr.innerHTML = `
                    <td style="padding: 1rem;">
                        <strong>${escapeHtml(r.restaurant_name)}</strong><br>
                        <small style="color:var(--text-muted)">${escapeHtml(r.public_slug_internal)}</small><br>
                        <small style="color:var(--text-muted)">Template: ${escapeHtml(r.template_key || 'free_default')}</small>
                    </td>
                    <td style="padding: 1rem;">
                        ${escapeHtml(r.owner_email)}<br>
                        <small style="color: ${r.is_active ? 'var(--success)' : 'var(--error)'}">${r.is_active ? 'Aktiv' : 'Inaktiv'}</small>
                    </td>
                    <td style="padding: 1rem;"><span class="badge badge-${escapeHtml(r.current_plan)}">${escapeHtml(r.current_plan.toUpperCase())}</span></td>
                    <td style="padding: 1rem;">
                        <span class="status-pill ${publishedClass}">${published ? 'published' : 'draft'}</span><br>
                        <small style="color:var(--text-muted)">${r.last_publish_status ? `letztes Event: ${escapeHtml(r.last_publish_status)}` : 'kein Publish-Event'}</small>
                    </td>
                    <td style="padding: 1rem;">
                        <span class="status-pill ${domainClass}">${escapeHtml(domainStatus)}</span><br>
                        <small style="color:var(--text-muted)">${escapeHtml(r.free_hostname || `${r.public_slug_internal}-restiq.pages.dev`)}</small>
                    </td>
                    <td style="padding: 1rem;">
                        <div class="admin-actions">
                            <a href="/preview/${r.id}" target="_blank">Preview</a>
                            ${publishedLink}
                            <button type="button" onclick="prepareCf(${r.id}, this)">CF vorbereiten</button>
                        </div>
                    </td>
                `;
                table.appendChild(tr);
            }
        }

        async function prepareCf(restaurantId, button) {
            const alertBox = document.getElementById('alert');
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = 'Bereite vor...';
            alertBox.className = 'alert hidden';

            try {
                const res = await fetch(`/api/admin/cf-prepare/${restaurantId}`, { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    alertBox.innerHTML = `Cloudflare-Export vorbereitet: <code>${escapeHtml(data.targetHostname)}</code>`;
                    alertBox.className = 'alert alert-success';
                    alertBox.classList.remove('hidden');
                    await loadRestaurants();
                } else {
                    alertBox.textContent = data.error || 'Cloudflare-Vorbereitung fehlgeschlagen.';
                    alertBox.className = 'alert alert-error';
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                alertBox.textContent = 'Serverfehler bei der Cloudflare-Vorbereitung.';
                alertBox.className = 'alert alert-error';
                alertBox.classList.remove('hidden');
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'index.html';
        });

        loadRestaurants();
    </script>
</body>
</html>

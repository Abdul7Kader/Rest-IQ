<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Restiq</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-shell { max-width: 1280px; margin: 0 auto; padding: 2rem; }
        .admin-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2rem; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .metric { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
        .metric-label { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 0.35rem; }
        .metric-value { font-size: 1.6rem; font-weight: 800; }
        .filter-bar { display: grid; grid-template-columns: minmax(220px, 1fr) 160px 180px auto; gap: 0.75rem; align-items: end; margin-bottom: 1rem; }
        .admin-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .admin-actions a, .admin-actions button { font-size: 0.8rem; padding: 0.4rem 0.6rem; text-decoration: none; border-radius: 4px; }
        .admin-actions a { background: var(--bg); color: var(--primary); border: 1px solid var(--border); }
        .btn-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .status-pill { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .status-ok { background: #dcfce7; color: #166534; }
        .status-warn { background: #fef3c7; color: #92400e; }
        .status-muted { background: #e2e8f0; color: #475569; }
        .detail-panel { margin-top: 1.5rem; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .detail-list { margin: 0; padding-left: 1rem; color: var(--text-muted); }
        .management-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .compact-list { display: grid; gap: 0.75rem; margin-top: 1rem; }
        .compact-item { border-top: 1px solid var(--border); padding-top: 0.75rem; }
        .inline-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .table-wrap { padding: 0; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; vertical-align: top; }
        thead { background: var(--bg); border-bottom: 1px solid var(--border); }
        tbody tr { border-bottom: 1px solid var(--border); }
        @media (max-width: 860px) {
            .admin-shell { padding: 1rem; }
            .admin-top { align-items: flex-start; flex-direction: column; }
            .filter-bar { grid-template-columns: 1fr; }
            .inline-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="admin-shell">
        <div class="admin-top">
            <div>
                <strong style="color: var(--primary);">Restiq Platform Admin</strong>
                <h1 style="margin-top: 0.5rem;">Plattformübersicht</h1>
                <p class="muted">Restaurants, Tarife, Domainstatus, Inhalte und Deploy-Vorbereitung.</p>
            </div>
            <div class="toolbar">
                <button type="button" class="secondary" data-action="refresh-admin">Aktualisieren</button>
                <a href="#" id="logoutBtn">Abmelden</a>
            </div>
        </div>

        <div id="alert" class="alert hidden"></div>
        <div id="summaryGrid" class="summary-grid"></div>

        <div class="management-grid">
            <div class="card">
                <h2>Plattform-Konfiguration</h2>
                <form id="settingsForm">
                    <div class="form-group"><label>Support-E-Mail</label><input type="email" name="support_email"></div>
                    <div class="form-group"><label>Standard-Werbelabel</label><input type="text" name="default_ad_label"></div>
                    <div class="form-group"><label>Domain-Hinweis</label><textarea name="domain_affiliate_note" rows="3"></textarea></div>
                    <label><input type="checkbox" name="quality_review_required" style="width:auto;"> Menschliche Qualitätsprüfung vor Livegang erforderlich</label>
                    <button type="submit" style="margin-top: 1rem;">Einstellungen speichern</button>
                </form>
            </div>
            <div class="card">
                <h2>Domain-Partner & Affiliates</h2>
                <form id="providerForm">
                    <input type="hidden" name="id">
                    <div class="inline-grid">
                        <div class="form-group"><label>Name</label><input type="text" name="provider_name" required></div>
                        <div class="form-group"><label>Typ</label><select name="provider_type"><option value="registrar">Registrar</option><option value="free_hosting">Free Hosting</option><option value="both">Beides</option></select></div>
                    </div>
                    <div class="form-group"><label>Website</label><input type="url" name="website_url" required></div>
                    <div class="form-group"><label>Affiliate-Link</label><input type="url" name="affiliate_base_url"></div>
                    <div class="inline-grid">
                        <label><input type="checkbox" name="supports_free_domains" style="width:auto;"> Free-Domains</label>
                        <label><input type="checkbox" name="supports_paid_domains" style="width:auto;"> Paid-Domains</label>
                    </div>
                    <div class="inline-grid">
                        <label><input type="checkbox" name="is_active" style="width:auto;" checked> Aktiv</label>
                        <div class="form-group"><label>Sortierung</label><input type="number" name="sort_order" value="0"></div>
                    </div>
                    <button type="submit">Partner speichern</button>
                    <button type="button" class="secondary" data-action="reset-provider-form">Neu</button>
                </form>
                <div id="providerList" class="compact-list"></div>
            </div>
            <div class="card">
                <h2>Werbeplätze</h2>
                <form id="adSlotForm">
                    <input type="hidden" name="id">
                    <div class="inline-grid">
                        <div class="form-group"><label>Slot-Key</label><input type="text" name="slot_key" placeholder="free_menu_top"></div>
                        <div class="form-group"><label>Platzierung</label><select name="placement"><option value="hero">Hero</option><option value="menu">Menü</option><option value="sidebar">Sidebar</option><option value="footer">Footer</option></select></div>
                    </div>
                    <div class="form-group"><label>Label</label><input type="text" name="label" required></div>
                    <div class="form-group"><label>Provider</label><input type="text" name="provider_name" placeholder="manual, AdSense später"></div>
                    <div class="form-group"><label>Platzhaltertext</label><textarea name="placeholder_text" rows="2"></textarea></div>
                    <label><input type="checkbox" name="is_active" style="width:auto;" checked> Aktiv</label>
                    <button type="submit" style="margin-top: 1rem;">Werbeplatz speichern</button>
                    <button type="button" class="secondary" data-action="reset-ad-slot-form">Neu</button>
                </form>
                <div id="adSlotList" class="compact-list"></div>
            </div>
        </div>

        <div class="card">
            <div class="filter-bar">
                <div class="form-group">
                    <label>Suche</label>
                    <input type="search" id="searchInput" placeholder="Restaurant, Slug oder Owner">
                </div>
                <div class="form-group">
                    <label>Tarif</label>
                    <select id="planFilter">
                        <option value="">Alle</option>
                        <option value="free">Free</option>
                        <option value="paid">Paid</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Free-Domain</label>
                    <select id="domainFilter">
                        <option value="">Alle</option>
                        <option value="pending">Pending</option>
                        <option value="active">Active</option>
                        <option value="not_prepared">Nicht vorbereitet</option>
                    </select>
                </div>
                <button type="button" class="secondary" data-action="reset-filters">Zurücksetzen</button>
            </div>
        </div>

        <div class="card table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Restaurant</th>
                        <th>Owner</th>
                        <th>Tarif</th>
                        <th>Inhalte</th>
                        <th>Deploy</th>
                        <th>Domains</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody id="restaurantTable"></tbody>
            </table>
        </div>

        <div id="detailPanel" class="detail-panel"></div>
    </div>

    <script src="/js/admin-page.js"></script>
</body>
</html>
